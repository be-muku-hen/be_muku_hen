<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>be_muku_hen</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    font-weight:300;
    letter-spacing:.18em;
    margin-bottom:60px;
}

button{
    background:transparent;
    color:white;
    border:1px solid white;
    padding:16px 55px;
    font-size:18px;
    letter-spacing:.25em;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:white;
    color:black;
}

button:active{
    transform:scale(.96);
}

#photo{
    display:none;
    width:80vw;
    height:60vh;
    object-fit:contain;
    margin-top:40px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>be_muku_hen</h1>

<button onclick="showRandom()">PUSH</button>

<br>

<img id="photo">

</div>

<script>

let currentInstagramURL = null;

async function showRandom(){

    const apiURL =
        "https://api.github.com/repos/be-muku-hen/be_muku_hen/contents/images";

    try {

        // GitHubから画像一覧を取得
        const response = await fetch(apiURL);
        const files = await response.json();

        // 画像だけ取り出す
        const photos = files.filter(file =>
            /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
        );

        if (photos.length === 0) {
            alert("画像がありません");
            return;
        }

        // ランダムに1枚選ぶ
        const random =
            Math.floor(Math.random() * photos.length);

        const selectedPhoto = photos[random];

        const img =
            document.getElementById("photo");

        // 写真を表示
        img.src = selectedPhoto.download_url;
        img.style.display = "block";


        // -------------------------
        // ファイル名から番号を取得
        // -------------------------

        const match =
            selectedPhoto.name.match(/線と記号_(\d+)/);

        if (!match) {
            currentInstagramURL = null;
            return;
        }

        const number = match[1];


        // -------------------------
        // CSVを取得
        // -------------------------

        const csvResponse =
            await fetch("urls.csv");

        const csvText =
            await csvResponse.text();


        // -------------------------
        // CSVから番号を探す
        // -------------------------

        const lines =
            csvText.split(/\r?\n/);

        currentInstagramURL = null;

        for (const line of lines) {

            const columns =
                line.split(",");

            if (columns[0].trim() === number) {

                currentInstagramURL =
                    columns[1].trim();

                break;
            }
        }

    } catch (error) {

        console.error(error);
        alert("画像を読み込めませんでした");

    }
}


// -------------------------
// 写真をタップしたらInstagramへ
// -------------------------

document.getElementById("photo").onclick = function(){

    if (currentInstagramURL) {

        window.location.href =
            currentInstagramURL;

    } else {

        alert("この写真に対応するInstagram投稿がありません");

    }

};

</script>

</body>
</html>
