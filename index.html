<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>be_muku_hen</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    font-weight:300;
    letter-spacing:.18em;
    margin-bottom:60px;
}

button{
    background:transparent;
    color:white;
    border:1px solid white;
    padding:16px 55px;
    font-size:18px;
    letter-spacing:.25em;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:white;
    color:black;
}

button:active{
    transform:scale(.96);
}

#photo{
    display:none;
    max-width:80vw;
    max-height:60vh;
    margin-top:40px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>be_muku_hen</h1>

<button onclick="showRandom()">PUSH</button>

<br>

<a id="postLink" target="_blank">
    <img id="photo">
</a>

</div>

<script>

const works = [

{
    image:"IMG_0051 3.jpg",
    instagram:"https://www.instagram.com/p/ここに投稿ID/"
},

{
    image:"IMG_0052.jpg",
    instagram:"https://www.instagram.com/p/ここに投稿ID/"
},

{
    image:"IMG_0053.jpg",
    instagram:"https://www.instagram.com/p/ここに投稿ID/"
}

];

function showRandom(){

    const work = works[Math.floor(Math.random()*works.length)];

    document.getElementById("photo").src = work.image;
    document.getElementById("photo").style.display = "block";

    document.getElementById("postLink").href = work.instagram;

}

</script>

</body>
</html>
