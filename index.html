<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>be_muku_hen</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    font-weight:300;
    letter-spacing:.18em;
    margin-bottom:60px;
}

button{
    background:transparent;
    color:white;
    border:1px solid white;
    padding:16px 55px;
    font-size:18px;
    letter-spacing:.25em;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:white;
    color:black;
}

button:active{
    transform:scale(.96);
}

#photo{
    display:none;
    max-width:80vw;
    max-height:60vh;
    margin-top:40px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>be_muku_hen</h1>

<button onclick="showRandom()">PUSH</button>

<br>

<img id="photo">

</div>

<script>

// 現在存在する画像
const photos = [
    "線と記号_1.jpg",
    "線と記号_2.jpg",
    "線と記号_7.jpg",
    "線と記号_15.jpg"
];

function showRandom(){

    const number = Math.floor(Math.random() * photos.length);

    const img = document.getElementById("photo");

    img.src = photos[number];
    img.style.display = "block";

}

</script>

</body>
</html>
